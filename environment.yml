name: swot-eddy
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - xarray
  - netcdf4
  - matplotlib
  - pyyaml
  - pytest
  - pip:
      # PyPI pyEddyTracker (3.6.1) pins numpy<1.23 / numba<0.56 / netCDF4<1.6 and is
      # uninstallable on Python >=3.12. Install the maintained GitHub master instead.
      - "git+https://github.com/AntSimi/py-eddy-tracker.git"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swot-eddy"
version = "0.0.1"
requires-python = ">=3.10"
# numpy pinned <2: py-eddy-tracker / numba / matplotlib in this env are built against
# numpy 1.x (P0 resolved numpy 1.26.4). scikit-image 0.24.x supports numpy 1.x.
dependencies = ["pyyaml", "xarray", "netcdf4", "numpy<2", "scikit-image==0.24.0",
                "pandas", "ipywidgets", "cartopy", "shapely",   # pandas/ipywidgets: catalog+labeler; cartopy: coastline; shapely: AOI5 polygon clip
                "torch"]                                        # U-Net inference/training (CPU wheel is enough for inference)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

# SWOT Gulf Stream eddy-detection baseline — project config.
# Paths are resolved per platform in src/swot_eddy/config.py (windows / wsl / colab,
# auto-detected; override with the SWOT_EDDY_ENV env var).

paths:
  windows:        # native Windows (Python from cmd/PowerShell)
    data_root: "C:/Users/jspier/Data/SWOT/SWOT_L3_GulfStream"
    out_root:  "C:/Users/jspier/SWOT-eddy-ml/out"
  wsl:            # WSL bash sees the Windows C: drive under /mnt/c
    data_root: "/mnt/c/Users/jspier/Data/SWOT/SWOT_L3_GulfStream"
    out_root:  "/mnt/c/Users/jspier/SWOT-eddy-ml/out"
  colab:
    data_root: "/content/drive/MyDrive/SWOT_L3_GulfStream"
    out_root:  "/content/drive/MyDrive/swot-eddy-ml/out"

# GS_AOI5 polygon (concave; clips SE open ocean, keeps Gulf Stream + inland).
# Single source of truth for the study area, versioned in the repo. load_config()
# derives the crop ENVELOPE (region, below) from this polygon; detections are filtered
# to the true polygon by center point-in-polygon (src/swot_eddy/aoi.py).
# Relative paths resolve against the repo root; a per-platform dict of absolute
# paths (windows/wsl/colab keys) is also accepted.
aoi: "config/GS_AOI5.json"

region:           # SUPERSEDED by aoi: load_config() OVERWRITES this with the AOI5 polygon
  # envelope at runtime. Values below are only a fallback if cfg['aoi'] is absent.
  # NOTE: source longitude is 0..360 (Gulf Stream ~278..291); region_mask normalizes via %360.
  lat_min: 23.5137
  lat_max: 42.6863
  lon_min: -82.4787
  lon_max: -69.1456

product:
  product_version: "3.0"
  variables:      # version-aware variable-name map, keyed on product_version
    "3.0":
      ssha: "ssha_filtered"          # detection channel (denoised, what PET runs on)
      ssha_adt_base: "ssha_unedited" # ADT base SSHA: ADT = ssha_unedited + mdt (matches reference figures)
      mdt: "mdt"
      ugos: "ugos_filtered"
      vgos: "vgos_filtered"
      ugosa: "ugosa_filtered"        # geostrophic velocity ANOMALY (zonal); VIZ/vetting only
      vgosa: "vgosa_filtered"        # geostrophic velocity ANOMALY (meridional); VIZ/vetting only
      quality_flag: "quality_flag"
  # quality_flag is CATEGORICAL (0=good, 3=eclipse, 5=local_outliers, 10=bad_coast,
  # 18/19=unsure, 20=ice, 25=rain, 30=soft_outliers, 50=extremes, 70=mission_event,
  # 100=bad_swath_extremities, 101=not_on_sea, 102=no_data).
  # FAITHFUL to de Marez: NO extra quality masking. Use ssha_filtered as the product
  # provides it and biharmonic-inpaint only its EXISTING NaN gaps (nadir, rain, etc.).
  # quality_max=null -> compute_channels skips the qf mask. (Was 3; dropped for fidelity.)
  quality_max: null

tiling:
  tile_size: 128
  stride: 64
  pad_to: 128     # across-track NaN-pad target width

features:        # contextual features (src/swot_eddy/features.py)
  # GS front = OPEN ADT contour at this level (closed rings = eddies, dropped). Level from
  # sweep vs 822 hand labels (scripts/validate_front.py): AUC plateau 0.30-0.35 (0.948/0.952);
  # 0.35 picked for 0% missing-front rate. See docs/2026-07-12-frontal-prior-methods.md.
  front_level_m: 0.35
  front_min_vertices: 20   # ~40 km of line at 2 km/px; shorter fragments = noise

pet:
  pet_version: "0+untagged.754.g229543f"
  params:
    shape_error: 85        # de Marez et al. (2026): 85% maximizes detections
    min_radius_km: 5       # on R_max (speed radius), per paper
    min_amplitude_m: 0.01
    gap_reject_frac: 0.40       # reject if >40% of speed contour overlaps gaps (paper)
    gap_reject_frac_nadir: 0.60 # relaxed tolerance when center sits in the nadir gap (paper)
    nadir_reject_frac: 0.70     # DROP if >=70% of eddy AREA sits in the nadir gap (biharmonic-invented)
    # PET pixel_limit (min,max) pixels inside contour. de Marez = PET-standard (4,1000).
    pixel_limit_min: 4
    pixel_limit_max: 1000
    high_pass_km: null     # NO high-pass / detrending (paper runs on filtered SLA as-is)

# Example file for the inspection script (Task 2), RELATIVE to the active platform's
# data_root (so it resolves correctly on windows / wsl / colab without editing).
example_file: "cycle_043/SWOT_L3_LR_SSH_Expert_043_410_20251228T034857_20251228T044023_v3.0.nc"

# SWOT JPL L2 regridded GeoZarr/icechunk store (equirectangular 0.02, cycles 1-50).
# Read by scripts/fetch_zarr_window.py + scripts/predict_hybrid_gridded.py only;
# the L3 swath chain never touches this block.
l2zarr:
  store: "s3://swot-zarr/ice/c001_002_expert.icechunk"
  s3_region: "us-west-2"
  fetch_python: "/mnt/c/Users/jspier/swot-250m-geozarr/.venv/bin/python"
  out_dir: "out/aoi5/l2zarr"

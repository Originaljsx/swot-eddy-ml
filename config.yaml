# SWOT Gulf Stream eddy-detection baseline — project config.
# Paths are resolved per platform in src/swot_eddy/config.py (windows / wsl / colab,
# auto-detected; override with the SWOT_EDDY_ENV env var).

paths:
  windows:        # native Windows (Python from cmd/PowerShell)
    data_root: "C:/Users/jspier/Data/SWOT/SWOT_L3_GulfStream"
    out_root:  "C:/Users/jspier/SWOT-eddy-ml/out"
  wsl:            # WSL bash sees the Windows C: drive under /mnt/c
    data_root: "/mnt/c/Users/jspier/Data/SWOT/SWOT_L3_GulfStream"
    out_root:  "/mnt/c/Users/jspier/SWOT-eddy-ml/out"
  colab:
    data_root: "/content/drive/MyDrive/SWOT_L3_GulfStream"
    out_root:  "/content/drive/MyDrive/swot-eddy-ml/out"

region:           # study box; lon negative = West, lat positive = North
  # NOTE (observed from real v3.0 files): source longitude is stored in the
  # 0..360 convention (Gulf Stream ~278..291), NOT -180..180. P1 cropping MUST
  # normalize before selecting, e.g. lon360 = lon_min % 360 / lon_max % 360,
  # or convert the data to -180..180. A naive sel(lon=slice(-82,-69)) on raw
  # 0..360 data silently returns zero points.
  lat_min: 23
  lat_max: 42
  lon_min: -82
  lon_max: -69

product:
  product_version: "3.0"
  variables:      # version-aware variable-name map, keyed on product_version
    "3.0":
      ssha: "ssha_filtered"
      mdt: "mdt"
      ugos: "ugos_filtered"
      vgos: "vgos_filtered"
      quality_flag: "quality_flag"

tiling:
  tile_size: 128
  stride: 64
  pad_to: 128     # across-track NaN-pad target width

pet:
  pet_version: "0+untagged.754.g229543f"
  params:
    shape_error: 85
    min_radius_km: 5
    min_amplitude_m: 0.01
    gap_reject_frac: 0.40
    gap_reject_frac_nadir: 0.60
    high_pass_km: null     # PET detection high-pass; swept in P2

# Example file for the inspection script (Task 2), RELATIVE to the active platform's
# data_root (so it resolves correctly on windows / wsl / colab without editing).
example_file: "cycle_002/SWOT_L3_LR_SSH_Expert_002_091_20230814T072907_20230814T082033_v3.0.nc"
